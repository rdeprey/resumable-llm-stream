<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interrupt a streaming answer</title>
<style>body{font:1rem/1.5 system-ui;max-width:60rem;margin:auto;padding:2rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:2rem}pre{white-space:pre-wrap}button{padding:.5rem}</style>
<h1>Interrupt a streaming answer</h1>
<button id="start">Start generation</button> <button id="toggle" disabled>Disconnect</button>
<label><input id="race" type="checkbox"> Disconnect before applying chunk 5</label>
<p id="status" role="status">Ready</p><main><section><h2>Browser transcript</h2><p id="answer"></p></section><section><h2>Saved on the server</h2><pre id="log"></pre></section></main>
<script type="module">
import { empty, apply, observe } from './client.mjs';
const el = id => document.getElementById(id);
let id, connection, state, timer;
function disconnect() {
  connection?.abort();
  connection = null;
  el('toggle').textContent = 'Reconnect';
  el('status').textContent = 'Disconnected after applying event ' + state.cursor;
}
async function connect() {
  const active = connection = new AbortController();
  el('toggle').textContent = 'Disconnect';
  el('status').textContent = 'Connected';
  try {
    await observe('', id, state, active.signal, event => {
      if (event.seq === 5 && el('race').checked) {
        el('race').checked = false;
        disconnect();
        return;
      }
      state = apply(state, event);
      el('answer').textContent = state.text;
      el('status').textContent = state.status + ' · last applied event ' + state.cursor;
      if (state.status !== 'streaming') {
        el('start').disabled = false;
        el('toggle').disabled = true;
      }
    });
  } catch (error) {
    if (!active.signal.aborted) { disconnect(); el('status').textContent = error.message; }
  }
}
el('toggle').onclick = () => connection ? disconnect() : connect();
el('start').onclick = async () => {
  el('start').disabled = true;
  clearInterval(timer);
  try {
    const response = await fetch('/runs', { method: 'POST' });
    ({ id } = await response.json());
    state = empty();
    el('answer').textContent = '';
    el('log').textContent = '';
    el('toggle').disabled = false;
    timer = setInterval(async () => {
      const current = id;
      const rows = await (await fetch('/log?id=' + current)).json();
      if (current !== id) return;
      el('log').textContent = rows.map(e => e.seq + '  ' + e.kind + '  ' + e.text).join('\n');
      if (['done','error'].includes(rows.at(-1)?.kind)) clearInterval(timer);
    }, 250);
    connect();
  } catch (error) { el('status').textContent = error.message; el('start').disabled = false; }
};
</script></html>
